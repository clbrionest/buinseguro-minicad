name: MiniCAD - Continuous Integration

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel / PHP 8.4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, curl, gd, zip, intl, bcmath, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PHP platform
        run: composer check-platform-reqs

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      # Preparar recursos frontend para las vistas Blade
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci
        

      - name: Build Vite assets
        run: npm run build

      - name: Verify Vite manifest
        run: test -f public/build/manifest.json

      # Pint temporalmente no bloqueante
      - name: Check PHP formatting
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Verify SemVer & Changelog
        run: php artisan version:sync --dry-run

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: php artisan test

      - name: Auto-update SemVer & CHANGELOG on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.php == '8.4'
        run: |
          php artisan version:sync
          if ! git diff --quiet version.json CHANGELOG.md package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            NEW_VER=$(php -r '$d = json_decode(file_get_contents("version.json"), true); echo $d["version"] ?? "1.0.0";')
            git add version.json CHANGELOG.md package.json
            git commit -m "chore(release): bump SemVer to v${NEW_VER} [skip ci]"
            git tag -f "v${NEW_VER}"
            git push origin HEAD:main --tags
          fi